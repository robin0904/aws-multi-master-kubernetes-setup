---
# =============================================================================
# ansible/roles/kubernetes/tasks/main.yml
# Install Kubernetes components: kubeadm, kubelet, kubectl
# =============================================================================

- name: Add Kubernetes repository
  yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version.split('.')[0] }}.{{ kubernetes_version.split('.')[1] }}/rpm/
    enabled: yes
    gpgcheck: yes
    gpgkey: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version.split('.')[0] }}.{{ kubernetes_version.split('.')[1] }}/rpm/repodata/repomd.xml.key
    repo_gpgcheck: yes

- name: Install Kubernetes components
  yum:
    name:
      - "kubelet-{{ kubeadm_version }}"
      - "kubeadm-{{ kubeadm_version }}"
      - "kubectl-{{ kubectl_version }}"
    state: present
    allow_downgrade: yes

- name: Create kubelet systemd drop-in directory
  file:
    path: /etc/systemd/system/kubelet.service.d
    state: directory
    mode: '0755'

- name: Create kubelet kubeadm config
  copy:
    dest: /etc/systemd/system/kubelet.service.d/10-kubeadm.conf
    content: |
      # Note: This dropin only works with kubeadm and kubelet v1.11+
      [Service]
      Environment="KUBELET_KUBECONFIG_ARGS=--bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf --kubeconfig=/etc/kubernetes/kubelet.conf"
      Environment="KUBELET_CONFIG_ARGS=--config=/var/lib/kubelet/config.yaml"
      EnvironmentFile=-/var/lib/kubelet/kubeadm-flags.env
      EnvironmentFile=-/etc/default/kubelet
      ExecStart=
      ExecStart=/usr/bin/kubelet $KUBELET_KUBECONFIG_ARGS $KUBELET_CONFIG_ARGS $KUBELET_EXTRA_ARGS
    mode: '0644'

- name: Create kubelet configuration directory
  file:
    path: /var/lib/kubelet
    state: directory
    mode: '0755'

- name: Enable kubelet service
  systemd:
    name: kubelet
    enabled: yes
    daemon_reload: yes

- name: Verify kubeadm installation
  command: kubeadm version -o short
  register: kubeadm_version_output
  changed_when: false

- name: Verify kubelet installation
  command: kubelet --version
  register: kubelet_version_output
  changed_when: false

- name: Verify kubectl installation
  command: kubectl version --client=true
  register: kubectl_version_output
  changed_when: false

- name: Print Kubernetes component versions
  debug:
    msg: |
      kubeadm: {{ kubeadm_version_output.stdout }}
      kubelet: {{ kubelet_version_output.stdout }}
      kubectl: {{ kubectl_version_output.stdout }}
